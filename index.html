<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Four Kingdoms Scorer</title>
<style>
  :root{
    --bg:#0f2d24;
    --felt:#123a2e;
    --gold:#d4a940;
    --card:#f7f3e8;
    --muted:#7d8c81;
    --danger:#b5473a;
    --success:#3a7d55;
    --line:#2a5445;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    background-image:radial-gradient(circle at 50% 0%, var(--felt), var(--bg) 70%);
    color:var(--card);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    min-height:100vh;
    padding-bottom:40px;
  }
  header{text-align:center;padding:22px 16px 14px;}
  header .crown{font-size:26px;letter-spacing:6px;color:var(--gold);}
  header h1{margin:6px 0 2px;font-size:21px;font-weight:600;letter-spacing:0.5px;}
  header p{margin:0;color:#9db3a8;font-size:13px;}
  .wrap{max-width:480px;margin:0 auto;padding:0 14px;}

  .names{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 18px;}
  .names input{width:100%;padding:9px 10px;border-radius:8px;border:1px solid var(--line);
    background:rgba(255,255,255,0.05);color:var(--card);font-size:14px;}
  .names input:focus{outline:1px solid var(--gold);}

  .scoreboard{background:var(--felt);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:18px;}
  .scoreboard h2{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:1.5px;color:var(--gold);text-align:center;}
  .totals{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .total-card{background:rgba(0,0,0,0.18);border-radius:10px;padding:10px 8px;text-align:center;}
  .total-card .nm{font-size:12px;color:#9db3a8;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .total-card .sc{font-size:24px;font-weight:700;color:var(--gold);}
  .total-card.lead{border:1px solid var(--gold);}
  .total-card .adjrow{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:6px;}
  .total-card .adjrow button{padding:5px 8px;border-radius:6px;border:1px solid var(--line);
    background:rgba(255,255,255,0.06);color:var(--gold);font-size:12px;}

  .section-title{font-size:13px;text-transform:uppercase;letter-spacing:1.5px;color:#9db3a8;margin:22px 0 10px;}

  .chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
  .chip{
    padding:9px 13px;border-radius:20px;border:1px solid var(--line);
    background:rgba(255,255,255,0.04);color:var(--card);font-size:13px;font-weight:600;
  }
  .chip.active{background:var(--gold);color:#2b210a;border-color:var(--gold);}
  .chip.used{opacity:0.35;pointer-events:none;text-decoration:line-through;}

  #kingdomStatus{color:var(--gold);}

  .next-kingdom-btn{
    width:100%;margin:4px 0 16px;padding:10px;border-radius:10px;
    border:1px dashed var(--gold);background:transparent;color:var(--gold);font-size:13px;
  }

  .panel{background:var(--felt);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;}
  .panel h3{margin:0 0 10px;font-size:13px;color:var(--gold);text-transform:uppercase;letter-spacing:1px;}
  .panel .subhint{font-size:11.5px;color:var(--muted);margin:-4px 0 10px;}

  .player-row{display:flex;align-items:center;justify-content:space-between;padding:8px 4px;border-bottom:1px solid var(--line);gap:8px;}
  .player-row:last-child{border-bottom:none;}
  .player-row .pname{font-size:13.5px;flex:1;}

  select{background:rgba(255,255,255,0.06);color:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 8px;font-size:13px;}

  .stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden;}
  .stepper button{background:transparent;border:none;color:var(--gold);font-size:18px;width:30px;height:30px;}
  .stepper span{min-width:18px;text-align:center;font-size:13px;}

  .dual-stepper{display:flex;gap:10px;}
  .dual-stepper .grp{display:flex;flex-direction:column;align-items:center;gap:3px;}
  .dual-stepper .lbl{font-size:10px;color:var(--muted);}

  .radio-list{display:flex;flex-direction:column;gap:2px;}
  .radio-row{display:flex;align-items:center;gap:8px;padding:6px 4px;font-size:13.5px;}
  .radio-row input{accent-color:var(--gold);width:16px;height:16px;}

  .submit-btn{width:100%;margin-top:6px;padding:13px;border-radius:10px;border:none;
    background:var(--gold);color:#2b210a;font-size:15px;font-weight:700;letter-spacing:0.3px;}
  .submit-btn[disabled]{opacity:0.4;}
  .hint{font-size:12px;color:var(--muted);margin-top:10px;text-align:center;}

  .history{margin-top:10px;}
  .round-entry{background:var(--felt);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:13px;}
  .round-entry .rtitle{display:flex;justify-content:space-between;color:var(--gold);font-weight:600;margin-bottom:4px;}
  .round-entry .rgames{font-size:11px;color:var(--muted);margin-bottom:6px;}
  .round-entry .rline{display:flex;justify-content:space-between;color:#c9d6cd;padding:2px 0;}
  .round-entry .delta.pos{color:var(--success);}
  .round-entry .delta.neg{color:var(--danger);}
  .empty{text-align:center;color:var(--muted);font-size:13px;padding:16px 0;}

  .reset-btn{width:100%;margin-top:26px;padding:11px;border-radius:10px;border:1px solid var(--danger);
    background:transparent;color:#e0958a;font-size:13px;}
</style>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#123a2e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="4 Kingdoms">
<link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>
<div id="lockScreen" style="position:fixed;inset:0;background:#0f2d24;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;">
  <div style="font-size:22px;letter-spacing:6px;color:#d4a940;margin-bottom:10px;">Karo Sons Jacks Queens KingHeart</div>
  <div style="font-size:20px;font-weight:600;color:#f7f3e8;margin-bottom:18px;">Four Kingdoms Scorer</div>
  <input id="lockInput" type="password" placeholder="Enter password" style="width:100%;max-width:280px;padding:12px 14px;border-radius:8px;border:1px solid #2a5445;background:rgba(255,255,255,0.06);color:#f7f3e8;font-size:15px;text-align:center;margin-bottom:10px;">
  <button id="lockSubmit" style="width:100%;max-width:280px;padding:12px;border-radius:8px;border:none;background:#d4a940;color:#2b210a;font-weight:700;font-size:15px;">Enter</button>
  <div id="lockError" style="color:#e0958a;font-size:12px;margin-top:10px;visibility:hidden;">Incorrect password.</div>
</div>
<script>
  (function(){
    const APP_PASSWORD = "123";
    const LOCK_KEY = "fourKingdomsUnlocked";
    const lockScreen = document.getElementById("lockScreen");
    const lockInput = document.getElementById("lockInput");
    const lockSubmit = document.getElementById("lockSubmit");
    const lockError = document.getElementById("lockError");

    function tryUnlock(){
      try{
        if(sessionStorage.getItem(LOCK_KEY) === "yes"){
          lockScreen.style.display = "none";
          return true;
        }
      }catch(e){}
      return false;
    }
    if(!tryUnlock()){
      lockSubmit.addEventListener("click", attempt);
      lockInput.addEventListener("keydown", e=>{ if(e.key === "Enter") attempt(); });
      function attempt(){
        if(lockInput.value === APP_PASSWORD){
          try{ sessionStorage.setItem(LOCK_KEY, "yes"); }catch(e){}
          lockScreen.style.display = "none";
        } else {
          lockError.style.visibility = "visible";
          lockInput.value = "";
          lockInput.focus();
        }
      }
      lockInput.focus();
    }
  })();
</script>
<div class="wrap">
  <header>
    <div class="crown">Karo Sons Jacks Queens KingHeart</div>
    <h1>Four Kingdoms</h1>
    <p>Combined round scorer</p>
  </header>

  <div class="names" id="nameInputs"></div>

  <div class="scoreboard">
    <h2>Standings</h2>
    <div class="totals" id="totals"></div>
  </div>

  <div class="section-title" id="kingdomStatus">Kingdom 1 of 4 &middot; games available this turn</div>
  <div class="chip-row" id="chipRow"></div>
  <button class="next-kingdom-btn" id="nextKingdomBtn">Skip to next kingdom</button>

  <div id="entryPanels"></div>
  <button class="submit-btn" id="submitRound">Add round</button>
  <div class="hint">Select one or more games above, fill in each panel, then add the round once.</div>

  <div class="section-title">Round history</div>
  <div class="history" id="history"></div>

  <button class="reset-btn" id="resetBtn">Reset game</button>
</div>

<script>
const STORAGE_KEY = "fourKingdomsScorerState_v2";

const GAME_DEFS = {
  jacks:   { label:"Jacks",       kind:"rank" },
  karo:    { label:"Karo",        kind:"count", perCard:-10, max:12, challenge:{win:65, lose:-65} },
  sons:    { label:"Sons",        kind:"count", perCard:-15, max:13 },
  queens:  { label:"Queens",      kind:"queens" },
  kingheart:{ label:"King Heart", kind:"single", penalty:-150 }
};
const RANK_POINTS = [200,150,100,50];

let state = loadState() || {
  players:["Kingdom 1","Kingdom 2","Kingdom 3","Kingdom 4"],
  rounds:[],
  activeGames:["jacks"],
  kingdomTurn:0,
  playedThisKingdom:[]
};
if(!state.players || state.players.length!==4){
  state.players = ["Kingdom 1","Kingdom 2","Kingdom 3","Kingdom 4"];
}
if(typeof state.kingdomTurn !== "number") state.kingdomTurn = 0;
if(!Array.isArray(state.playedThisKingdom)) state.playedThisKingdom = [];
if(!state.activeGames || state.activeGames.length===0){
  const remaining = Object.keys(GAME_DEFS).filter(k=>!state.playedThisKingdom.includes(k));
  state.activeGames = remaining.length ? [remaining[0]] : [];
}

function loadState(){
  try{ const raw = localStorage.getItem(STORAGE_KEY); return raw? JSON.parse(raw): null; }
  catch(e){ return null; }
}
function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
}
function escapeHtml(s){
  const d = document.createElement("div"); d.textContent = s; return d.innerHTML;
}
function totals(){
  const t = state.players.map(()=>0);
  state.rounds.forEach(r=> r.deltas.forEach((d,i)=> t[i]+=d));
  return t;
}

function renderNameInputs(){
  const el = document.getElementById("nameInputs");
  el.innerHTML = "";
  state.players.forEach((name,i)=>{
    const input = document.createElement("input");
    input.value = name;
    input.maxLength = 16;
    input.addEventListener("change", e=>{
      state.players[i] = e.target.value.trim() || `Kingdom ${i+1}`;
      saveState();
      renderAll();
    });
    el.appendChild(input);
  });
}

function renderTotals(){
  const el = document.getElementById("totals");
  const t = totals();
  const max = Math.max(...t);
  el.innerHTML = "";
  state.players.forEach((name,i)=>{
    const card = document.createElement("div");
    card.className = "total-card" + (t[i]===max && max!==0 ? " lead":"");
    card.innerHTML = `<div class="nm">${escapeHtml(name)}</div><div class="sc">${t[i]}</div>
      <div class="adjrow">
        <button data-act="minus" data-idx="${i}">-5</button>
        <button data-act="edit" data-idx="${i}">Edit</button>
        <button data-act="plus" data-idx="${i}">+5</button>
      </div>`;
    el.appendChild(card);
  });
  el.querySelectorAll("button[data-act]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const idx = parseInt(btn.dataset.idx,10);
      const act = btn.dataset.act;
      if(act==="minus") applyManualAdjustment(idx,-5);
      else if(act==="plus") applyManualAdjustment(idx,5);
      else editScoreDirectly(idx);
    });
  });
}

function applyManualAdjustment(idx, amount){
  const deltas = state.players.map((_,i)=> i===idx? amount:0);
  state.rounds.push({label:"Manual adjustment", games:["manual"], deltas,
    detail:[`${state.players[idx]}: ${amount>0?"+":""}${amount}`]});
  saveState();
  renderAll();
}
function editScoreDirectly(idx){
  const current = totals()[idx];
  const input = prompt(`Set ${state.players[idx]}'s total score`, current);
  if(input===null) return;
  const target = parseInt(input,10);
  if(isNaN(target)){ alert("Enter a whole number."); return; }
  const diff = target-current;
  if(diff===0) return;
  applyManualAdjustment(idx, diff);
}

function renderChips(){
  const statusEl = document.getElementById("kingdomStatus");
  const totalGames = Object.keys(GAME_DEFS).length;
  statusEl.textContent = `Kingdom ${state.kingdomTurn+1} of 4 · ${state.playedThisKingdom.length}/${totalGames} games played this turn`;

  const el = document.getElementById("chipRow");
  el.innerHTML = "";
  Object.keys(GAME_DEFS).forEach(key=>{
    const used = state.playedThisKingdom.includes(key);
    const chip = document.createElement("div");
    chip.className = "chip" + (state.activeGames.includes(key) ? " active":"") + (used ? " used":"");
    chip.textContent = GAME_DEFS[key].label + (used ? " (played)" : "");
    if(used){ el.appendChild(chip); return; }
    chip.addEventListener("click", ()=>{
      if(state.activeGames.includes(key)){
        if(state.activeGames.length===1) return;
        state.activeGames = state.activeGames.filter(k=>k!==key);
      } else {
        state.activeGames.push(key);
      }
      saveState();
      renderChips();
      renderEntryPanels();
    });
    el.appendChild(chip);
  });
}

function stepperHtml(idx, min, max, prefix){
  return `<div class="stepper">
    <button data-stp="minus" data-prefix="${prefix}" data-idx="${idx}">-</button>
    <span id="${prefix}-val-${idx}">0</span>
    <button data-stp="plus" data-prefix="${prefix}" data-idx="${idx}">+</button>
  </div>`;
}

function wireStepper(container, prefix, idx, counterObj, min, max){
  const val = container.querySelector(`#${prefix}-val-${idx}`);
  container.querySelectorAll(`button[data-stp][data-prefix="${prefix}"][data-idx="${idx}"]`).forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const dir = btn.dataset.stp === "plus" ? 1 : -1;
      counterObj.val = Math.max(min, Math.min(max, counterObj.val + dir));
      val.textContent = counterObj.val;
    });
  });
}

function renderEntryPanels(){
  const el = document.getElementById("entryPanels");
  el.innerHTML = "";
  window._roundState = {}; // reset per-panel working data

  state.activeGames.forEach(key=>{
    const def = GAME_DEFS[key];
    const panel = document.createElement("div");
    panel.className = "panel";

    if(def.kind === "rank"){
      panel.innerHTML = `<h3>${def.label}</h3><div class="subhint">Pick each kingdom's finish: 1st=200, 2nd=150, 3rd=100, 4th=50.</div><div id="rows-${key}"></div>`;
      el.appendChild(panel);
      const rows = panel.querySelector(`#rows-${key}`);
      state.players.forEach((name,i)=>{
        const row = document.createElement("div");
        row.className = "player-row";
        row.innerHTML = `<span class="pname">${escapeHtml(name)}</span>`;
        const sel = document.createElement("select");
        sel.dataset.key = key; sel.dataset.idx = i;
        sel.innerHTML = `<option value="">Place...</option>` +
          [1,2,3,4].map(p=>`<option value="${p}">${p===1?"1st":p===2?"2nd":p===3?"3rd":"4th"} (${RANK_POINTS[p-1]})</option>`).join("");
        row.appendChild(sel);
        rows.appendChild(row);
      });

    } else if(def.kind === "count"){
      const challengeHtml = def.challenge ? `
        <div class="subhint" style="margin-top:12px;">Challenge: a player attempts to collect ALL the ${def.label} cards.</div>
        <label class="radio-row"><input type="checkbox" id="challenge-active-${key}"><span>Challenge attempted this round</span></label>
        <div id="challenge-details-${key}" style="display:none;">
          <div class="subhint">Who attempted it:</div>
          <div class="radio-list" id="challenge-player-${key}"></div>
          <div class="subhint" style="margin-top:8px;">Outcome:</div>
          <div class="radio-list">
            <label class="radio-row"><input type="radio" name="challenge-outcome-${key}" value="win" checked><span>Succeeded (+${def.challenge.win} to challenger, ${def.challenge.lose} to the other 3)</span></label>
            <label class="radio-row"><input type="radio" name="challenge-outcome-${key}" value="lose"><span>Failed - didn't collect all (${def.challenge.lose} to them only)</span></label>
          </div>
        </div>
      ` : "";
      panel.innerHTML = `<h3>${def.label}</h3><div class="subhint">Cards collected (0-${def.max}), ${def.perCard} pts each.</div><div id="rows-${key}"></div>${challengeHtml}`;
      el.appendChild(panel);
      const rows = panel.querySelector(`#rows-${key}`);
      window._roundState[key] = {
        counts: state.players.map(()=>({val:0})),
        challenge: { active:false, player:0, outcome:"win" }
      };
      state.players.forEach((name,i)=>{
        const row = document.createElement("div");
        row.className = "player-row";
        row.innerHTML = `<span class="pname">${escapeHtml(name)}</span>${stepperHtml(i,0,def.max,key)}`;
        rows.appendChild(row);
        wireStepper(rows, key, i, window._roundState[key].counts[i], 0, def.max);
      });

      if(def.challenge){
        const cb = panel.querySelector(`#challenge-active-${key}`);
        const details = panel.querySelector(`#challenge-details-${key}`);
        const playerWrap = panel.querySelector(`#challenge-player-${key}`);
        state.players.forEach((name,i)=>{
          const row = document.createElement("label");
          row.className = "radio-row";
          row.innerHTML = `<input type="radio" name="challenge-who-${key}" value="${i}" ${i===0?"checked":""}><span>${escapeHtml(name)}</span>`;
          playerWrap.appendChild(row);
        });
        cb.addEventListener("change", ()=>{
          window._roundState[key].challenge.active = cb.checked;
          details.style.display = cb.checked ? "block" : "none";
          rows.querySelectorAll("button").forEach(b=> b.disabled = cb.checked);
        });
        playerWrap.querySelectorAll(`input[name="challenge-who-${key}"]`).forEach(r=>{
          r.addEventListener("change", e=>{
            window._roundState[key].challenge.player = parseInt(e.target.value,10);
          });
        });
        panel.querySelectorAll(`input[name="challenge-outcome-${key}"]`).forEach(r=>{
          r.addEventListener("change", e=>{
            window._roundState[key].challenge.outcome = e.target.value;
          });
        });
      }

    } else if(def.kind === "queens"){
      panel.innerHTML = `<h3>Queens</h3><div class="subhint">Normal queen = -25. Doubled queen = -50.</div><div id="rows-${key}"></div>
        <div class="subhint" style="margin-top:12px;">Reveal bets: a player reveals a queen, betting someone else collects it. If a queen is revealed and successfully passed on, the revealer gains +25.</div>
        <div id="reveals-${key}"></div>
        <button type="button" class="chip" id="addReveal-${key}" style="margin-top:6px;">+ Add reveal bet</button>`;
      el.appendChild(panel);
      const rows = panel.querySelector(`#rows-${key}`);
      window._roundState[key] = {
        counts: state.players.map(()=>({normal:{val:0}, doubled:{val:0}})),
        reveals: []
      };
      state.players.forEach((name,i)=>{
        const row = document.createElement("div");
        row.className = "player-row";
        row.innerHTML = `<span class="pname">${escapeHtml(name)}</span>
          <div class="dual-stepper">
            <div class="grp"><span class="lbl">Normal</span>${stepperHtml(i,0,4,"qn")}</div>
            <div class="grp"><span class="lbl">Doubled</span>${stepperHtml(i,0,4,"qd")}</div>
          </div>`;
        rows.appendChild(row);
        wireStepper(rows, "qn", i, window._roundState[key].counts[i].normal, 0, 4);
        wireStepper(rows, "qd", i, window._roundState[key].counts[i].doubled, 0, 4);
      });

      const revealsEl = panel.querySelector(`#reveals-${key}`);
      function addRevealRow(){
        const revealObj = { player: 0 };
        window._roundState[key].reveals.push(revealObj);
        const row = document.createElement("div");
        row.className = "player-row";
        const playerSel = document.createElement("select");
        state.players.forEach((name,i)=>{
          const opt = document.createElement("option");
          opt.value = i; opt.textContent = name;
          playerSel.appendChild(opt);
        });
        playerSel.addEventListener("change", e=>{ revealObj.player = parseInt(e.target.value,10); });
        const label = document.createElement("span");
        label.textContent = "+25";
        label.style.color = "var(--success)";
        label.style.fontSize = "13px";
        const removeBtn = document.createElement("button");
        removeBtn.type = "button";
        removeBtn.textContent = "Remove";
        removeBtn.className = "chip";
        removeBtn.addEventListener("click", ()=>{
          const idx = window._roundState[key].reveals.indexOf(revealObj);
          if(idx>=0) window._roundState[key].reveals.splice(idx,1);
          row.remove();
        });
        row.appendChild(playerSel);
        row.appendChild(label);
        row.appendChild(removeBtn);
        revealsEl.appendChild(row);
      }
      panel.querySelector(`#addReveal-${key}`).addEventListener("click", addRevealRow);

    } else if(def.kind === "single"){
      panel.innerHTML = `<h3>King Heart</h3>
        <div class="subhint">Was it revealed by its holder (betting someone else collects it)?</div>
        <div class="radio-list" id="reveal-${key}">
          <label class="radio-row"><input type="radio" name="khrev-${key}" value="no" checked><span>Not revealed</span></label>
          <label class="radio-row"><input type="radio" name="khrev-${key}" value="yes"><span>Revealed</span></label>
        </div>
        <div id="revealer-wrap-${key}" style="display:none;">
          <div class="subhint">Revealed by:</div>
          <div class="radio-list" id="revealer-${key}"></div>
        </div>
        <div class="subhint" style="margin-top:10px;">Who ended up collecting the King of Hearts?</div>
        <div class="radio-list" id="rows-${key}"></div>`;
      el.appendChild(panel);

      const revealerWrap = panel.querySelector(`#revealer-wrap-${key}`);
      const revealerRows = panel.querySelector(`#revealer-${key}`);
      state.players.forEach((name,i)=>{
        const row = document.createElement("label");
        row.className = "radio-row";
        row.innerHTML = `<input type="radio" name="khrevealer-${key}" value="${i}" ${i===0?"checked":""}><span>${escapeHtml(name)}</span>`;
        revealerRows.appendChild(row);
      });
      panel.querySelectorAll(`input[name="khrev-${key}"]`).forEach(r=>{
        r.addEventListener("change", ()=>{
          revealerWrap.style.display = r.value==="yes" && r.checked ? "block" : "none";
        });
      });

      const rows = panel.querySelector(`#rows-${key}`);
      const noneRow = document.createElement("label");
      noneRow.className = "radio-row";
      noneRow.innerHTML = `<input type="radio" name="kh-${key}" value="-1" checked><span>No one</span>`;
      rows.appendChild(noneRow);
      state.players.forEach((name,i)=>{
        const row = document.createElement("label");
        row.className = "radio-row";
        row.innerHTML = `<input type="radio" name="kh-${key}" value="${i}"><span>${escapeHtml(name)}</span>`;
        rows.appendChild(row);
      });
    }
  });
}

function collectAndSubmitRound(){
  if(state.activeGames.length===0){ alert("Select at least one game."); return; }
  const deltas = state.players.map(()=>0);
  const detailLines = [];
  const gamesUsed = [];

  for(const key of state.activeGames){
    const def = GAME_DEFS[key];
    if(def.kind === "rank"){
      const sels = document.querySelectorAll(`select[data-key="${key}"]`);
      const places = Array.from(sels).map(s=>s.value);
      if(places.some(p=>p==="")){ alert(`Set a finishing place for every kingdom in ${def.label}.`); return; }
      if(new Set(places).size !== 4){ alert(`Each place in ${def.label} can only be used once.`); return; }
      places.forEach((p,i)=>{
        const pts = RANK_POINTS[parseInt(p,10)-1];
        deltas[i]+=pts;
        detailLines.push(`${state.players[i]} (${def.label}): ${p==="1"?"1st":p==="2"?"2nd":p==="3"?"3rd":"4th"} = +${pts}`);
      });
      gamesUsed.push(def.label);

    } else if(def.kind === "count"){
      const cState = window._roundState[key];
      if(cState.challenge && cState.challenge.active){
        const challenger = cState.challenge.player;
        if(cState.challenge.outcome === "win"){
          state.players.forEach((name,i)=>{
            if(i===challenger){
              deltas[i]+=def.challenge.win;
              detailLines.push(`${state.players[i]} (${def.label} challenge): succeeded = +${def.challenge.win}`);
            } else {
              deltas[i]+=def.challenge.lose;
              detailLines.push(`${state.players[i]} (${def.label} challenge): ${def.challenge.lose}`);
            }
          });
        } else {
          deltas[challenger]+=def.challenge.lose;
          detailLines.push(`${state.players[challenger]} (${def.label} challenge): failed = ${def.challenge.lose}`);
        }
      } else {
        cState.counts.forEach((c,i)=>{
          if(c.val>0){
            const pts = c.val*def.perCard;
            deltas[i]+=pts;
            detailLines.push(`${state.players[i]} (${def.label}): ${c.val} card${c.val!==1?"s":""} = ${pts}`);
          }
        });
      }
      gamesUsed.push(def.label);

    } else if(def.kind === "queens"){
      const qState = window._roundState[key];
      qState.counts.forEach((c,i)=>{
        const n = c.normal.val, d = c.doubled.val;
        if(n>0 || d>0){
          const pts = -25*n + -50*d;
          deltas[i]+=pts;
          const parts = [];
          if(n>0) parts.push(`${n} normal`);
          if(d>0) parts.push(`${d} doubled`);
          detailLines.push(`${state.players[i]} (Queens collected): ${parts.join(", ")} = ${pts}`);
        }
      });
      qState.reveals.forEach(rv=>{
        deltas[rv.player]+=25;
        detailLines.push(`${state.players[rv.player]} (Queen reveal bet): +25`);
      });
      gamesUsed.push(def.label);

    } else if(def.kind === "single"){
      const revealChoice = document.querySelector(`input[name="khrev-${key}"]:checked`);
      const revealed = revealChoice ? revealChoice.value==="yes" : false;
      let revealer = null;
      if(revealed){
        const revealerRadio = document.querySelector(`input[name="khrevealer-${key}"]:checked`);
        revealer = revealerRadio ? parseInt(revealerRadio.value,10) : null;
      }
      const radio = document.querySelector(`input[name="kh-${key}"]:checked`);
      const collector = radio ? parseInt(radio.value,10) : -1;

      if(collector>=0){
        const penalty = revealed ? -150 : -75;
        deltas[collector]+=penalty;
        detailLines.push(`${state.players[collector]} (King Heart collected${revealed?", revealed":""}): ${penalty}`);
      }
      if(revealed && revealer!==null){
        if(collector>=0 && collector!==revealer){
          deltas[revealer]+=75;
          detailLines.push(`${state.players[revealer]} (King Heart reveal bet): succeeded = +75`);
        } else {
          deltas[revealer]+=-75;
          detailLines.push(`${state.players[revealer]} (King Heart reveal bet): failed = -75`);
        }
      }
      gamesUsed.push(def.label);
    }
  }

  if(detailLines.length===0){
    if(!confirm("No points changed hands this round - add it anyway?")) return;
  }

  state.rounds.push({
    label:`Kingdom ${state.kingdomTurn+1} · Round ${state.rounds.length+1}`,
    games: gamesUsed,
    deltas,
    detail: detailLines
  });

  state.activeGames.forEach(key=>{
    if(!state.playedThisKingdom.includes(key)) state.playedThisKingdom.push(key);
  });

  const totalGames = Object.keys(GAME_DEFS).length;
  if(state.playedThisKingdom.length >= totalGames){
    state.kingdomTurn += 1;
    state.playedThisKingdom = [];
  }
  const remaining = Object.keys(GAME_DEFS).filter(k=>!state.playedThisKingdom.includes(k));
  state.activeGames = remaining.length ? [remaining[0]] : [];

  saveState();
  renderAll();
}

function renderHistory(){
  const el = document.getElementById("history");
  el.innerHTML = "";
  if(state.rounds.length===0){
    el.innerHTML = `<div class="empty">No rounds logged yet.</div>`;
    return;
  }
  state.rounds.slice().reverse().forEach((r, revIdx)=>{
    const idx = state.rounds.length-1-revIdx;
    const entry = document.createElement("div");
    entry.className = "round-entry";
    const linesHtml = r.deltas.map((d,i)=>{
      if(d===0) return "";
      const cls = d>0?"pos":"neg";
      return `<div class="rline"><span>${escapeHtml(state.players[i])}</span><span class="delta ${cls}">${d>0?"+":""}${d}</span></div>`;
    }).join("");
    entry.innerHTML = `<div class="rtitle"><span>${escapeHtml(r.label)}</span><span data-del="${idx}" style="cursor:pointer;color:var(--muted);">x</span></div>
      <div class="rgames">${(r.games||[]).map(escapeHtml).join(" + ")}</div>
      ${linesHtml || '<div class="rline"><span>No change</span></div>'}`;
    el.appendChild(entry);
  });
  el.querySelectorAll("[data-del]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const idx = parseInt(btn.dataset.del,10);
      if(confirm("Remove this round?")){
        state.rounds.splice(idx,1);
        saveState();
        renderAll();
      }
    });
  });
}

function renderAll(){
  renderChips();
  renderTotals();
  renderEntryPanels();
  renderHistory();
}

document.getElementById("submitRound").addEventListener("click", collectAndSubmitRound);
document.getElementById("nextKingdomBtn").addEventListener("click", ()=>{
  if(state.playedThisKingdom.length===0 && !confirm("Move to the next kingdom without playing any games this turn?")) return;
  state.kingdomTurn += 1;
  state.playedThisKingdom = [];
  const remaining = Object.keys(GAME_DEFS);
  state.activeGames = remaining.length ? [remaining[0]] : [];
  saveState();
  renderAll();
});
document.getElementById("resetBtn").addEventListener("click", ()=>{
  if(confirm("Reset all scores and round history? Kingdom names are kept.")){
    state.rounds = [];
    state.kingdomTurn = 0;
    state.playedThisKingdom = [];
    state.activeGames = ["jacks"];
    saveState();
    renderAll();
  }
});

function boot(){
  renderNameInputs();
  renderAll();
}
if(document.readyState === "loading"){
  document.addEventListener("DOMContentLoaded", boot);
} else {
  boot();
}

if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("service-worker.js").catch(()=>{});
  });
}

</script>
